<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>主持与戏剧表演队</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== App Container ===== -->
  <div id="app">
    <!-- Page: 主持记忆 -->
    <div class="page" id="page-memories">
      <div class="page-header">
        <h1>🎭 主持记忆</h1>
        <p class="page-desc">我们共同的舞台回忆</p>
      </div>
      <div id="memoriesContent"></div>
    </div>

    <!-- Page: 队员风采 -->
    <div class="page" id="page-members">
      <div class="page-header">
        <h1>👥 队员风采</h1>
        <p class="page-desc">每一个闪光的你</p>
      </div>
      <div id="membersContent"></div>
    </div>

    <!-- Page: 我的 -->
    <div class="page" id="page-my">
      <div class="page-header">
        <h1>👤 我的</h1>
      </div>
      <div id="myContent"></div>
    </div>

    <!-- Member Detail Overlay -->
    <div class="overlay" id="memberDetail">
      <div class="overlay-content">
        <button class="overlay-close" id="closeMemberDetail">&times;</button>
        <div id="memberDetailContent"></div>
      </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
      <span class="lightbox-close" id="lightboxClose">&times;</span>
      <span class="lightbox-prev" id="lightboxPrev">&#10094;</span>
      <span class="lightbox-next" id="lightboxNext">&#10095;</span>
      <div class="lightbox-content">
        <img src="" alt="" id="lightboxImg">
        <div class="lightbox-caption" id="lightboxCaption"></div>
      </div>
    </div>

    <!-- Modal (Login / Register / Admin) -->
    <div class="modal" id="modal">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
  </div>

  <!-- ===== Bottom Navigation ===== -->
  <nav class="bottom-nav">
    <button class="nav-tab active" data-page="memories">
      <span class="nav-icon">📷</span>
      <span class="nav-label">主持记忆</span>
    </button>
    <button class="nav-tab" data-page="members">
      <span class="nav-icon">👥</span>
      <span class="nav-label">队员风采</span>
    </button>
    <button class="nav-tab" data-page="my">
      <span class="nav-icon">👤</span>
      <span class="nav-label">我的</span>
    </button>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
